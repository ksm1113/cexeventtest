<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:," />
<title>CEX Events — Binance</title>
<style>
  :root { color-scheme: light dark; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
         max-width: 1200px; margin: 24px auto; padding: 0 16px; }
  header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: 18px; margin: 0; }
  .actions { display: flex; gap: 8px; align-items: center; }
  button { padding: 6px 12px; cursor: pointer; border: 1px solid #888; background: transparent; border-radius: 4px; }
  button:hover { background: rgba(128,128,128,0.1); }
  table { width: 100%; border-collapse: collapse; margin-top: 14px; font-size: 13px; }
  th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid rgba(128,128,128,0.25); vertical-align: top; }
  th { background: rgba(128,128,128,0.08); font-weight: 600; }
  td a { color: inherit; }
  .tag { display: inline-block; padding: 1px 6px; background: rgba(80,120,255,0.15); border-radius: 3px; margin: 1px 2px 1px 0; font-size: 11px; }
  .muted { color: rgba(128,128,128,0.9); font-size: 12px; }
  .err { color: #c33; }
  .empty { text-align: center; padding: 30px; }
</style>
</head>
<body>
<header>
  <h1>CEX Events — Binance (Launchpool / Earn / Deposit)</h1>
  <div class="actions">
    <span id="status" class="muted"></span>
    <button id="refresh">Refresh</button>
  </div>
</header>
<table id="events">
  <thead><tr>
    <th>Title</th>
    <th>Category</th>
    <th>Matched</th>
    <th>APY Hint</th>
    <th>Published</th>
  </tr></thead>
  <tbody></tbody>
</table>

<script>
const REFRESH_MS = 60000;
let pendingController = null;

async function load() {
  // Cancel any in-flight fetch so a late response can't overwrite a newer one.
  if (pendingController) pendingController.abort();
  const ctrl = new AbortController();
  pendingController = ctrl;
  setStatus('Loading…');
  try {
    const r = await fetch('/api/events', { cache: 'no-store', signal: ctrl.signal });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error || 'unknown error');
    render(j.events || []);
    setStatus('Updated ' + new Date().toLocaleTimeString() + '  (' + (j.count ?? 0) + ' / ' + (j.raw_count ?? 0) + ' matched)');
  } catch (e) {
    if (e.name === 'AbortError') return;  // expected when superseded
    setStatus('<span class="err">Error: ' + esc(e.message) + '</span>', true);
  } finally {
    if (pendingController === ctrl) pendingController = null;
  }
}

function render(events) {
  const tb = document.querySelector('#events tbody');
  if (!events.length) {
    tb.innerHTML = '<tr><td colspan="5" class="empty muted">No matching events.</td></tr>';
    return;
  }
  tb.innerHTML = events.map(e => `
    <tr>
      <td>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener">${esc(e.title)}</a>` : esc(e.title)}</td>
      <td>${esc(e.category)}</td>
      <td>${(e.matched || []).map(m => `<span class="tag">${esc(m)}</span>`).join('')}</td>
      <td>${e.apy_hint ? esc(e.apy_hint) + '%' : ''}</td>
      <td class="muted">${esc(formatDate(e.published_at))}</td>
    </tr>
  `).join('');
}

function setStatus(html, isHtml = false) {
  const el = document.getElementById('status');
  if (isHtml) el.innerHTML = html;
  else el.textContent = html;
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => (
    { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
  ));
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  if (isNaN(d)) return iso;
  return d.toISOString().slice(0, 16).replace('T', ' ') + 'Z';
}

document.getElementById('refresh').addEventListener('click', load);
load();
setInterval(load, REFRESH_MS);
</script>
</body>
</html>
